<!DOCTYPE html>
<html lang="es" class="login-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - MAC Style Makeup Store</title>    
    <link rel="stylesheet" href="css/custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: url('images/fondo1.jpg') no-repeat center center fixed;
            background-size: cover; /* Este fondo no se verá porque está en un iframe */
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
        }

        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.3);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 38px;
            cursor: pointer;
            color: #eee;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #fff;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #ffc1e3;
            text-decoration: none;
            transition: color 0.3s;
        }

        a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .auth-separator {
             text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .auth-separator span {
            background: white;
            padding: 0 15px;
            color: #fff;
            position: relative;
            z-index: 1;
        }

        .auth-separator:before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: #e1e5e9;
            z-index: 0;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: #fee;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert-success {
            background: #eff;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert-warning {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }

    </style>
</head>
<body>
    

    <div class="login-container">
        <h2>Iniciar Sesión</h2>
                
        <div id="alert-container"></div>
                
        <form id="login-form">
                    
            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="tu@correo.com">
            </div>
                    
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
                <div class="password-toggle">
                    <i class="fas fa-eye" id="toggle-password"></i>
                </div>
            </div>
                    
            <button type="submit" class="btn-primary" id="login-btn">
                <span id="login-text">Iniciar Sesión</span>
                <div id="login-spinner" class="spinner" style="display: none;"></div>
            </button>
        </form>
                
        <div class="auth-links">
            <p>¿No tienes cuenta? <a href="index.html#register" target="_top">Regístrate aquí</a></p>
            <p><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p>
        </div>

    </div>

    <script src="js/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Se eliminó el código fetch de 'base.html' y se integró el header directamente.
            
            // Inicializar Firebase
            let auth, db;
            try {
                // Reemplaza con la inicialización correcta si fuera necesario,
                // pero se mantiene el código original para compatibilidad con el script firebase-config.js.
                auth = firebase.auth();
                db = firebase.firestore();
            } catch (error) {
                console.error('Error inicializando Firebase:', error);
                showAlert('Error de configuración. Por favor contacta al administrador.', 'error');
                // Si Firebase no carga, detenemos la ejecución de lógica de autenticación
                return;
            }

            // --- Lógica del Header (antes en el fetch) ---
            const dropdownBtn = document.querySelector('.dropdown-btn');
            // Nota: Se asume que en el HTML original la navegación colapsable usa la clase .dropdown. 
            // Como no se incluyó, la funcionalidad solo se muestra como un ejemplo simple.
            // Si el menú completo está en un elemento aparte, se necesitaría el HTML de ese menú.

            // Mostrar/ocultar contraseña
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            
            if (togglePassword && passwordInput) {
                togglePassword.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }

            // Manejar envío del formulario de LOGIN
            const loginForm = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const loginText = document.getElementById('login-text');
            const loginSpinner = document.getElementById('login-spinner');

            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const email = document.getElementById('email')?.value;
                    const password = document.getElementById('password')?.value;
                    
                    // Validaciones básicas
                    if (!email || !password) {
                        showAlert('Por favor ingresa tu correo y contraseña', 'error');
                        return;
                    }

                    // Mostrar loading
                    if (loginText && loginSpinner && loginBtn) {
                        loginText.style.display = 'none';
                        loginSpinner.style.display = 'inline-block';
                        loginBtn.disabled = true;
                    }

                    try {
                        // Iniciar sesión en Firebase Auth
                        const userCredential = await auth.signInWithEmailAndPassword(email, password);                        
                        const user = userCredential.user;

                        // VERIFICAR ROL EN FIRESTORE
                        const userDoc = await db.collection('users').doc(user.uid).get();

                        if (!userDoc.exists) {
                            showAlert('Usuario no encontrado en la base de datos', 'error');
                            await auth.signOut();
                            return;
                        }

                        const userData = userDoc.data();
                        const userRole = userData.role;

                        // Mostrar mensaje de éxito
                        showAlert(`¡Bienvenido/a de nuevo! Redirigiendo...`, 'success');

                        // Redirigir a la página principal en el frame padre
                        setTimeout(() => {
                            if (window.top) {
                                window.top.location.href = 'index.html';
                            } else {
                                window.location.href = 'index.html';
                            }
                        }, 1500);

                    } catch (error) {
                        console.error('Error en inicio de sesión:', error);
                        
                        let errorMessage = 'Correo o contraseña incorrectos.';
                        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                            errorMessage = 'El correo electrónico o la contraseña no son válidos.';
                        } else if (error.code === 'auth/too-many-requests') {
                            errorMessage = 'Demasiados intentos fallidos. Intenta de nuevo más tarde.';
                        }
                        
                        showAlert(errorMessage, 'error');
                        loginText.style.display = 'inline';
                        loginSpinner.style.display = 'none';
                        loginBtn.disabled = false;
                    }
                });
            }

            // Función para mostrar alertas (se mantiene igual)
            function showAlert(message, type) {
                const alertContainer = document.getElementById('alert-container');
                if (!alertContainer) return;
                
                const alertClass = type === 'error' ? 'alert-error' : 
                                   type === 'success' ? 'alert-success' : 'alert-warning';
                
                alertContainer.innerHTML = `
                    <div class="alert ${alertClass}">
                        <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 
                                         type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i>
                        ${message}
                    </div>
                `;
                
                // Auto-eliminar alerta después de 8 segundos para mensajes largos
                setTimeout(() => {
                    if (alertContainer) {
                        alertContainer.innerHTML = '';
                    }
                }, 8000);
            }

            // Verificar si ya está autenticado
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // Si ya está logueado, redirigir
                    showAlert('Ya tienes una sesión activa. Redirigiendo...', 'warning');
                    setTimeout(() => {
                         if (window.top) {
                            window.top.location.href = 'index.html';
                        }
                    }, 2000);
                }
            });
        });
    </script>
</body>
</html>

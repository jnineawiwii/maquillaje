<!DOCTYPE html>
<html lang="es" class="login-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - MAC Style Makeup Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/custom.css?v=2.0">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="login-page">

    <div class="login-container">
        <h2>Crear Cuenta</h2>
        
        <!-- Mensajes de alerta -->
        <div id="alert-container"></div>
        
        <form id="register-form">
            <div class="form-group">
                <label for="displayName">Nombre completo:</label>
                <input type="text" id="displayName" name="displayName" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required minlength="6">
                <div class="password-toggle">
                    <i class="fas fa-eye" id="toggle-password"></i>
                </div>
                <small>Mínimo 6 caracteres</small>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <div class="password-toggle">
                    <i class="fas fa-eye" id="toggle-confirm-password"></i>
                </div>
            </div>
            
            <button type="submit" class="btn-primary" id="register-btn">
                <span id="register-text">Crear Cuenta</span>
                <div id="register-spinner" class="spinner" style="display: none;"></div>
            </button>
        </form>
        
        <div class="auth-links">
            <p>¿Ya tienes cuenta? <a href="#login">Inicia sesión aquí</a></p>
        </div>

        <!-- Separador -->
        <div class="auth-separator">
            <span>o</span>
        </div>

        <!-- Registro con Google -->
        <button type="button" class="btn-google" id="google-register-btn">
            <i class="fab fa-google"></i>
            Registrarse con Google
        </button>
    </div>

    <footer class="site-footer" style="position: absolute; bottom: 10px; width: 100%; text-align: center; color: white; z-index: 10;">
        <p>© 2023 MAC Style Makeup Store. Proyecto estudiantil sin derechos de autor.</p>
    </footer>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar Firebase
            const auth = firebase.auth();
            const db = firebase.firestore();

            // Mostrar/ocultar contraseña
            const togglePassword = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('password');
            const toggleConfirmPassword = document.getElementById('toggle-confirm-password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            toggleConfirmPassword.addEventListener('click', function() {
                const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordInput.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            // Manejar envío del formulario
            const registerForm = document.getElementById('register-form');
            const registerBtn = document.getElementById('register-btn');
            const registerText = document.getElementById('register-text');
            const registerSpinner = document.getElementById('register-spinner');

            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const displayName = document.getElementById('displayName').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                // Validaciones
                if (!displayName || !email || !password || !confirmPassword) {
                    showAlert('Por favor completa todos los campos', 'error');
                    return;
                }

                if (!isValidEmail(email)) {
                    showAlert('Por favor ingresa un correo electrónico válido', 'error');
                    return;
                }

                if (password.length < 6) {
                    showAlert('La contraseña debe tener al menos 6 caracteres', 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    showAlert('Las contraseñas no coinciden', 'error');
                    return;
                }

                // Mostrar loading
                registerText.style.display = 'none';
                registerSpinner.style.display = 'inline-block';
                registerBtn.disabled = true;

                try {
                    // Crear usuario en Firebase Auth
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const user = userCredential.user;

                    // Actualizar perfil con displayName
                    await user.updateProfile({
                        displayName: displayName
                    });

                    // Enviar email de verificación
                    await user.sendEmailVerification();

                    // Guardar información adicional en Firestore
                    await db.collection('users').doc(user.uid).set({
                        email: email,
                        displayName: displayName,
                        role: 'customer', // Rol por defecto
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        emailVerified: false
                    });

                    // Mostrar mensaje de éxito
                    showAlert(`¡Cuenta creada exitosamente! Se ha enviado un email de verificación a ${email}`, 'success');
                    
                    // Redirigir después de un breve delay
                    setTimeout(() => {
                        window.top.location.href = 'index.html#login';
                    }, 3000);

                } catch (error) {
                    console.error('Error en registro:', error);
                    
                    // Manejar errores específicos de Firebase
                    let errorMessage = 'Error al crear la cuenta';
                    
                    switch (error.code) {
                        case 'auth/email-already-in-use':
                            errorMessage = 'Ya existe una cuenta con este correo electrónico';
                            break;
                        case 'auth/invalid-email':
                            errorMessage = 'Correo electrónico inválido';
                            break;
                        case 'auth/operation-not-allowed':
                            errorMessage = 'Operación no permitida';
                            break;
                        case 'auth/weak-password':
                            errorMessage = 'La contraseña es demasiado débil';
                            break;
                        default:
                            errorMessage = error.message;
                    }
                    
                    showAlert(errorMessage, 'error');
                } finally {
                    // Ocultar loading
                    registerText.style.display = 'inline-block';
                    registerSpinner.style.display = 'none';
                    registerBtn.disabled = false;
                }
            });

            // Registro con Google
            const googleRegisterBtn = document.getElementById('google-register-btn');
            googleRegisterBtn.addEventListener('click', async function() {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.addScope('email');
                    provider.addScope('profile');

                    // Mostrar loading
                    googleRegisterBtn.disabled = true;
                    googleRegisterBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registrando...';

                    const result = await auth.signInWithPopup(provider);
                    const user = result.user;

                    // Verificar si es un usuario nuevo
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    
                    if (!userDoc.exists) {
                        // Crear documento de usuario en Firestore
                        await db.collection('users').doc(user.uid).set({
                            email: user.email,
                            displayName: user.displayName,
                            photoURL: user.photoURL,
                            role: 'customer',
                            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                            provider: 'google',
                            emailVerified: true
                        });
                    }

                    showAlert(`¡Bienvenido/a, ${user.displayName || user.email}!`, 'success');
                    
                    setTimeout(() => {
                        window.top.location.href = 'index.html#home';
                    }, 1500);

                } catch (error) {
                    console.error('Error en registro con Google:', error);
                    
                    let errorMessage = 'Error al registrarse con Google';
                    if (error.code === 'auth/popup-closed-by-user') {
                        errorMessage = 'El registro fue cancelado';
                    } else if (error.code === 'auth/popup-blocked') {
                        errorMessage = 'El popup fue bloqueado. Por favor permite popups para este sitio';
                    }
                    
                    showAlert(errorMessage, 'error');
                    
                    // Restaurar botón
                    googleRegisterBtn.disabled = false;
                    googleRegisterBtn.innerHTML = '<i class="fab fa-google"></i> Registrarse con Google';
                }
            });

            // Función para mostrar alertas
            function showAlert(message, type) {
                const alertContainer = document.getElementById('alert-container');
                const alertClass = type === 'error' ? 'alert-error' : 
                                   type === 'success' ? 'alert-success' : 'alert-warning';
                
                alertContainer.innerHTML = `
                    <div class="alert ${alertClass}">
                        <i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 
                                         type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i>
                        ${message}
                    </div>
                `;
                
                // Auto-eliminar alerta después de 8 segundos para mensajes largos
                setTimeout(() => {
                    alertContainer.innerHTML = '';
                }, 8000);
            }

            // Función para validar email
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            // Verificar si ya está autenticado
            auth.onAuthStateChanged((user) => {
                if (user) {
                    // Si ya está logueado, redirigir
                    showAlert('Ya tienes una sesión activa', 'warning');
                    setTimeout(() => {
                        window.top.location.href = 'index.html#home';
                    }, 2000);
                }
            });

            // Fix link to use hash routing
            const loginLink = document.querySelector('.auth-links a');
            if(loginLink) {
                loginLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.top.location.href = 'index.html#login';
                });
            }
        });
    </script>
</body>
</html>
